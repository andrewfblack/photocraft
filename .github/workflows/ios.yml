name: iOS

# Builds the iPadOS app on a GitHub-hosted macOS runner.
#
# Phase 1 pins the Xcode 26 / iOS 26 SDK: the iOS 27 SDK requires the UIScene life cycle, which
# winit's iOS backend does not support yet (rust-windowing/winit#4224). The macOS 26 runner ships
# Xcode 26.0.1–26.6 (iOS SDKs up to 26.5); pinning 26.6 satisfies Apple's recent-SDK rule while
# keeping the classic life cycle legal. See apps/photocraft-ios/README.md.
on:
  push:
    branches: [ios]
  pull_request:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      # The Rust workspace's MSRV; the runner's stable toolchain is newer, which is fine.
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.6 (iOS 26 SDK)
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install Rust + iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Build the Rust static library (device)
        run: cargo build --release -p photocraft-ios --target aarch64-apple-ios

      - name: Show the native libraries the staticlib needs (reference)
        continue-on-error: true
        run: |
          cargo rustc --release -p photocraft-ios --target aarch64-apple-ios -- --print native-static-libs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build the app (unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project PhotoCraft.xcodeproj \
            -scheme PhotoCraft \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-app
          path: ios/build/Build/Products/Release-iphoneos/PhotoCraft.app
          if-no-files-found: warn
