# XcodeGen spec for the PhotoCraft iOS app.
#
# The project is generated, not committed, so the build is reproducible and reviewable:
#   brew install xcodegen && (cd ios && xcodegen generate)
#
# The Rust side is a static library built by Cargo *before* Xcode runs:
#   cargo build --release -p photocraft-ios --target aarch64-apple-ios
# and linked here (`-lphotocraft_ios`, from the LIBRARY_SEARCH_PATHS below).
#
# Phase 1 targets the Xcode 26 / iOS 26 SDK on purpose: the iOS 27 SDK makes the UIScene life
# cycle mandatory and winit's iOS backend does not adopt it yet (rust-windowing/winit#4224).
# Building against the iOS 26 SDK keeps the classic life cycle legal and still runs on iOS 27.

name: PhotoCraft

options:
  bundleIdPrefix: ai.storyteller
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

# A shared scheme, so `xcodebuild -scheme PhotoCraft` works on a clean checkout (Xcode only
# auto-creates schemes in the IDE).
schemes:
  PhotoCraft:
    build:
      targets:
        PhotoCraft: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  PhotoCraft:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PhotoCraft
        CFBundleName: PhotoCraft
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # An empty UILaunchScreen is the modern launch screen (no storyboard needed).
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.storyteller.photocraft
        PRODUCT_NAME: PhotoCraft
        # Where Cargo leaves libphotocraft_ios.a (see the CI workflow).
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lphotocraft_ios"
    dependencies:
      # System frameworks the Rust static library references at the final link. A Rust `staticlib`
      # does not carry its dependencies' link directives, so the frameworks winit (UIKit),
      # wgpu/Metal, Rust std, CoreText/CoreGraphics (fonts) and the codecs need are listed here.
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreFoundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Security.framework
      - sdk: CoreText.framework
      - sdk: CoreServices.framework
      - sdk: ImageIO.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreAudio.framework
      - sdk: GameController.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Accelerate.framework
      - sdk: SystemConfiguration.framework
      - sdk: MobileCoreServices.framework
